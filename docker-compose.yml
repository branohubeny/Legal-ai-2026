services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: legal-ai-postgres
    environment:
      POSTGRES_DB: legal_ai
      POSTGRES_USER: legal
      POSTGRES_PASSWORD: legal_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal -d legal_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
